name: ci

# Keyless check: no Google credentials, nothing is run against BigQuery.
on:
  push:
  pull_request:

jobs:
  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest collector -q
      - run: uv run dbt parse --project-dir dbt --profiles-dir dbt
